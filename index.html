<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل أسرار وأفكار يوتيوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-center mb-2 text-red-500">محلل أسرار وأفكار يوتيوب</h1>
        <p class="text-gray-400 text-center mb-6">ضع رابط أي فيديو يوتيوب لاستخراج أسراره وأفكار منافسة لجلب المشاهدات.</p>
        
        <div class="space-y-4 mb-6">
            <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Gemini API الخاص بك هنا" 
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500 text-white">
            
            <div class="flex gap-2">
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." 
                    class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500 text-white">
                <button onclick="analyzeVideo()" 
                    class="bg-red-600 hover:bg-red-700 font-bold px-6 py-3 rounded-xl transition duration-200">تحليل الفيديو</button>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-6 text-red-400 animate-pulse">
            جارٍ تحليل الفيديو بالذكاء الاصطناعي... يرجى الانتظار ⏳
        </div>

        <div id="resultBox" class="hidden bg-gray-900 border border-gray-700 rounded-xl p-6 whitespace-pre-line text-gray-200 leading-relaxed">
        </div>
    </div>

    <script>
        async function analyzeVideo() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            
            if (!apiKey || !url) {
                alert('الرجاء إدخال مفتاح الـ API ورابط اليوتيوب معاً!');
                return;
            }

            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            resultBox.innerHTML = '';

            try {
                // استخراج معرف الفيديو من الرابط
                let videoId = url;
                if (url.includes("youtu.be/")) {
                    videoId = url.split("youtu.be/")[1].split("?")[0];
                } else if (url.includes("watch?v=")) {
                    videoId = url.split("watch?v=")[1].split("&")[0];
                }

                const prompt = `أنت خبير يوتيوب استراتيجي ومحلل محتوى فيروسي (Viral). قم بتحليل فيديو اليوتيوب الذي يحمل المعرف ${videoId} (أو بناءً على الرابط: ${url}) واقترح لي:
                1. أسرار نجاح الفيديو (الخطاف، القصة، سر الجذب).
                2. الكلمات المفتاحية والـ Tags للـ SEO.
                3. 3 أفكار فيديوهات شبيهة وجديدة لجلب المشاهدات مع العناوين والمقدمات.
                أجب باللغة العربية حصراً وبشكل منسق.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    resultBox.innerHTML = "❌ خطأ من واجهة البرمجة: " + data.error.message;
                } else {
                    const outputText = data.candidates[0].content.parts[0].text;
                    resultBox.innerHTML = outputText;
                }
                resultBox.classList.remove('hidden');
            } catch (error) {
                alert('حدث خطأ أثناء الاتصال بالخادم.');
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
